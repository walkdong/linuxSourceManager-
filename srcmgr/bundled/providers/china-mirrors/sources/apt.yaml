# Mainland-China APT mirrors.
#
# Two entries per mirror:
#   * <mirror>                 the base archive, url_template .../${distro}/ so the
#                              same entry expands to /debian/ on Debian and /ubuntu/
#                              on Ubuntu (apt's template_values() supplies the value).
#   * <mirror>-debian-security Debian-only: <codename>-security lives in the separate
#                              /debian-security/ archive, never inside /debian/.
#
# `components` is deliberately NOT set on the base entries: apt fills in the default
# set for the local family (Debian: main contrib non-free non-free-firmware,
# Ubuntu: main restricted universe multiverse), so one entry is correct on both.
# The Debian-security entries do carry the Debian component set.
managers: [apt]
sources:
  - key: tuna
    name: TUNA (Tsinghua)
    kind: mirror
    url_template: https://mirrors.tuna.tsinghua.edu.cn/${distro}/
    url: https://mirrors.tuna.tsinghua.edu.cn/debian/
    types: [deb]
    scope: system
    priority: 20
    description: >-
      Tsinghua University TUNA mirror: full Debian and Ubuntu archives, usually the
      most complete and one of the fastest mirrors in mainland China.
    homepage: https://mirrors.tuna.tsinghua.edu.cn/
    extra:
      countries: [cn]
    health:
      urls:
        - https://mirrors.tuna.tsinghua.edu.cn/debian/dists/stable/Release
        - https://mirrors.tuna.tsinghua.edu.cn/ubuntu/dists/noble/Release

  - key: tuna-debian-security
    name: TUNA Debian security
    kind: mirror
    url: https://mirrors.tuna.tsinghua.edu.cn/debian-security/
    suite: ${codename}-security
    components: [main, contrib, non-free, non-free-firmware]
    types: [deb]
    scope: system
    priority: 20
    description: >-
      TUNA mirror of the Debian security archive (<codename>-security).  Debian
      only; Ubuntu security is part of the normal ubuntu/ archive.
    homepage: https://mirrors.tuna.tsinghua.edu.cn/
    extra:
      countries: [cn]
    health:
      url: https://mirrors.tuna.tsinghua.edu.cn/debian-security/dists/stable-security/Release

