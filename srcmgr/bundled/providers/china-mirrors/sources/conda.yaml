# Conda channels in mainland China.  Each entry is the full channel URL that conda
# accepts directly in ~/.condarc `channels:`; the health URL reads that channel's
# noarch/repodata.json, i.e. the file conda itself fetches.
#
# Verification notes:
#   * Aliyun has no anaconda mirror: mirrors.aliyun.com/anaconda/**/noarch/repodata.json
#     answers 404, so it is not shipped despite being a common recommendation.
#   * USTC and BFSU now 302-redirect their anaconda trees to NJU and TUNA
#     respectively, so they are not listed as independent mirrors.
#   * TUNA, NJU, SJTU, ZJU, SUSTech and PKU all serve the channels below directly.
managers: [conda]
sources:
  - key: tuna-main
    name: TUNA main
    kind: mirror
    url: https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
    scope: user
    priority: 20
    description: Tsinghua TUNA mirror of the Anaconda `main` channel (defaults).
    homepage: https://mirrors.tuna.tsinghua.edu.cn/help/anaconda/
    extra:
      countries: [cn]
    health:
      url: https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/noarch/repodata.json

  - key: tuna-conda-forge
    name: TUNA conda-forge
    kind: mirror
    url: https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
    scope: user
    priority: 20
    description: Tsinghua TUNA mirror of the conda-forge channel.
    homepage: https://mirrors.tuna.tsinghua.edu.cn/help/anaconda/
    extra:
