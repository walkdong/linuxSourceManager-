name: build

# CI: tests on every push/PR, release artifacts on a version tag.
#
# Design notes:
#  * the binary job builds inside ubuntu:22.04 so the single-file download keeps working on
#    older releases (glibc is linked at build time);
#  * the binary is smoke-tested in a *bare* container that has no Python at all - that is
#    the whole point of shipping it;
#  * publishing to PyPI uses Trusted Publishing (OIDC), so no API token is stored anywhere.
#    It only runs for tags, and only after everything else passed.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.13 is current stable.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + UI tests (hermetic, offline)
        run: python -m pytest tests/ -q
      - name: Lint
        run: |
          pip install pyflakes
          python -m pyflakes srcmgr/ tests/

  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/srcmgr --cli version
          /tmp/verify/bin/srcmgr --cli --json managers >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binary:
    name: single-file binaries (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both flavours in an old-glibc container
        run: |
          mkdir -p dist
          ./scripts/build_binary.sh
      - name: Smoke-test in a container without Python
        run: |
          docker run --rm -v "$PWD/dist":/out:ro ubuntu:22.04 bash -lc '
            set -e
            /out/srcmgr-linux-x86_64 --version
            /out/srcmgr-linux-x86_64 --cli managers | head -5
            /out/srcmgr-linux-x86_64 --cli --json managers > /dev/null
            /out/srcmgr-cli-linux-x86_64 | head -3
            echo "SMOKE TEST PASSED"
          '
      - name: Checksums
        run: cd dist && sha256sum ./*-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*-linux-*
            dist/SHA256SUMS

  install-script:
    name: installer end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a wheel to install from
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install, run, uninstall in a throwaway HOME
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          SRCMGR_FROM=wheel SRCMGR_WHEEL="$(ls dist/*.whl)" sh scripts/install.sh
          "$HOME/.local/bin/srcmgr" --cli version
          test -f "$HOME/.local/share/applications/source-manager.desktop"
          sh scripts/install.sh --uninstall
          test ! -e "$HOME/.local/bin/srcmgr"
          test ! -e "$HOME/.local/share/applications/source-manager.desktop"

  release:
    name: GitHub release
    needs: [test, wheel, binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          cp artifacts/dist/* release/ 2>/dev/null || true
          cp artifacts/binaries/* release/ 2>/dev/null || true
          cd release && sha256sum ./* > SHA256SUMS 2>/dev/null || true
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## 安装方式

            **一行命令（推荐，任何发行版）**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```

            **单文件可执行（不需要 Python）**

            下载本页的 `srcmgr-linux-x86_64`，然后：

            ```sh
            chmod +x srcmgr-linux-x86_64 && ./srcmgr-linux-x86_64
            ```

            首次运行会把自己安装到 `~/.local/bin` 并创建应用菜单图标。

            校验下载：`sha256sum -c SHA256SUMS --ignore-missing`

  pypi:
    name: publish to PyPI
    needs: [test, wheel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC) - no token secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
